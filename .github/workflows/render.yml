name: Render Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "ID komposisi (lihat src/Root.tsx)"
        required: true
        default: "Hello"
      output:
        description: "Path file output"
        required: true
        default: "out/video.mp4"
      frames:
        description: "Rentang frame opsional, contoh: 0-89 (kosongkan = semua frame)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  render:
    name: Render dengan Remotion
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chrome Headless Shell (~150 MB) di-cache supaya render berikutnya tidak
      # mengunduh ulang. Lokasi cache: <project>/node_modules/.remotion
      - name: Cache Chrome Headless Shell
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Render
        env:
          COMPOSITION: ${{ github.event.inputs.composition }}
          OUTPUT: ${{ github.event.inputs.output }}
          FRAMES: ${{ github.event.inputs.frames }}
        run: |
          set -euo pipefail
          args=("$COMPOSITION" "$OUTPUT")
          if [ -n "${FRAMES}" ]; then
            args+=("--frames=${FRAMES}")
          fi
          npm run render -- "${args[@]}"

      - name: Upload hasil render
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: ${{ github.event.inputs.output }}
          if-no-files-found: error
          retention-days: 7
